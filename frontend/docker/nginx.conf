worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    # All runtime write paths are writable by the nginx user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # A missing backend must not receive a successful SPA HTML response.
        location = /api {
            return 404;
        }

        location ^~ /api/ {
            return 404;
        }

        # Vite fingerprints these files; missing assets must not return HTML.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
        }

        # Direct links and refreshes on client-side routes load the React app.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
