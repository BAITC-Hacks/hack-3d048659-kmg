python_version: "3.11"
internal_timezone: UTC
timezone: Asia/Almaty
utc_offset: "+05:00"
turbines:
  - id: 1
    lat: 43.645150
    lon: 78.535604
  - id: 2
    lat: 43.643198
    lon: 78.538828
# Shared point for both turbines; fetch once per weather run/request window.
weather_point:
  lat: 43.644174
  lon: 78.537216
  elevation: null # Let Open-Meteo use DEM.
weather:
  reuse_for_all_turbines: true
  record_returned_elevation_in_metadata: true
model:
  shared_across_turbines: true
  categorical_features:
    - turbine_id
  report_metrics_per_turbine: true
features:
  wind_direction:
    input_unit: degrees
    encoding: sin_cos
    output_columns:
      - wind_direction_sin
      - wind_direction_cos
weather_model: ecmwf_ifs
availability_delay_hours: 6
forecast_origin_local: "00:00"
horizon: 48
backtest:
  origin_start_local: "2026-01-31"
  origin_end_local: "2026-02-28"
  origins_inclusive: true
  archived_weather_forecasts_only: true
